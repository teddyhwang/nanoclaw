name: Registry skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.skills.outputs.matrix }}
      channels: ${{ steps.refs.outputs.channels }}
      providers: ${{ steps.refs.outputs.providers }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: skills
        run: |
          matrix=$(pnpm exec tsx scripts/test-registry-skills.ts --list)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - id: refs
        run: |
          # Forks normally carry only main. Registry skills still compose against
          # NanoClaw's canonical channel/provider branches, so fetch those refs
          # directly instead of assuming this fork mirrors them on origin.
          git fetch --no-tags https://github.com/nanocoai/nanoclaw.git \
            +refs/heads/channels:refs/remotes/registry/channels \
            +refs/heads/providers:refs/remotes/registry/providers
          echo "channels=$(git rev-parse refs/remotes/registry/channels)" >> "$GITHUB_OUTPUT"
          echo "providers=$(git rev-parse refs/remotes/registry/providers)" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure canonical registry remote
        run: git remote add registry https://github.com/nanocoai/nanoclaw.git
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun
        with:
          bun-version: 1.3.12
      - run: pnpm install --frozen-lockfile
      - name: Apply and test ${{ matrix.skill }}
        env:
          NANOCLAW_REGISTRY_REMOTE: registry
          REGISTRY_CHANNELS_SHA: ${{ needs.discover.outputs.channels }}
          REGISTRY_PROVIDERS_SHA: ${{ needs.discover.outputs.providers }}
        run: pnpm exec tsx scripts/test-registry-skills.ts "${{ matrix.skill }}"
